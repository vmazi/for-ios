name: "Build iOS app (unsigned)"

on:
  workflow_dispatch:

jobs:
  build_unsigned:
    runs-on: macos-14
    steps:
      - name: Select Xcode 15.1
        run: sudo xcode-select -s /Applications/Xcode_15.1.app/Contents/Developer

      - name: Xcode version
        run: /usr/bin/xcodebuild -version

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build archive (unsigned)
        run: |
          xcodebuild -scheme Stoat \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -archivePath "$RUNNER_TEMP/Stoat.xcarchive" \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            clean archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package unsigned IPA
        run: |
          APP_DIR="$RUNNER_TEMP/Stoat.xcarchive/Products/Applications"
          echo "Archive apps:"; ls -la "$APP_DIR"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_DIR/Stoat.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qr Stoat-unsigned.ipa Payload
          ls -la "$RUNNER_TEMP/Stoat-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Stoat-unsigned-ipa
          path: ${{ runner.temp }}/Stoat-unsigned.ipa
          retention-days: 5
